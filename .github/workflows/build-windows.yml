name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build EXE (PyInstaller)
        run: pyinstaller PDFLibraryPro.spec --noconfirm --clean

      - name: Smoke-test the built EXE (starts without Python, creates UI, exits 0)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PDFLibraryPro.exe" -ArgumentList "--selftest" -PassThru -Wait
          Write-Host "ExitCode: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PDFLibraryPro.iss'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDFLibraryPro-windows
          path: |
            dist/PDFLibraryPro.exe
            dist/PDFLibraryPro-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: PDF Library Pro ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: |
            dist/PDFLibraryPro.exe
            dist/PDFLibraryPro-Setup.exe
